ServerName localhost
ServerTokens Prod
ServerSignature Off

# Dokploy terminates TLS at its reverse proxy. Preserve the HTTPS signal for
# application code that sets secure session-cookie attributes conditionally.
SetEnvIf X-Forwarded-Proto ^https$ HTTPS=on

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# These directories are needed by server-side includes or build/runtime code,
# but none is intended to be requested directly over HTTP.
<DirectoryMatch ^/var/www/html/(?:config|docker|docs|includes|ml|scripts|src|supabase|tests|vendor)(?:/|$)>
    Require all denied
</DirectoryMatch>

<FilesMatch ^\.>
    Require all denied
</FilesMatch>

<FilesMatch ^(?:composer\.(?:json|lock)|docker-compose\.ya?ml|Dockerfile)$>
    Require all denied
</FilesMatch>
