<section class="rounded-xl border border-slate-200 bg-white p-4">
  <div class="flex items-center justify-between gap-3">
    <div>
      <h3 class="text-lg font-black text-slate-800">Barangay User Assignment</h3>
      <p class="text-xs text-slate-500">Module 5 assignment administration</p>
    </div>
    <span class="rounded-full border border-slate-200 px-2 py-1 text-[11px] font-bold uppercase text-slate-600">EDIT</span>
  </div>

  <div class="mt-4 grid gap-3">
    <label class="block">
      <span class="text-xs font-bold uppercase text-slate-600">CIVentral User Reference</span>
      <input class="mt-1 w-full rounded border border-slate-300 px-3 py-2" type="text" name="user_reference" value="" placeholder="trusted user_reference">
    </label>

    <div class="block">
      <span class="text-xs font-bold uppercase text-slate-600">Barangay</span>
      <select class="mt-1 w-full rounded border border-slate-300 px-3 py-2" name="barangay_id" data-assignment-barangay>
        <option value="">Select barangay</option>
      </select>
    </div>

    <div class="text-sm text-slate-600">
      <span class="font-bold">Current Assignment:</span>
      <span data-assignment-current>None</span>
    </div>

    <div class="flex gap-2">
      <button class="rounded bg-slate-900 px-3 py-2 text-xs font-black text-white" type="button" data-assignment-set>Assign / Change</button>
      <button class="rounded border border-slate-300 px-3 py-2 text-xs font-black text-slate-700" type="button" data-assignment-deactivate>Deactivate</button>
    </div>

    <div data-assignment-feedback class="mt-3 hidden rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-[10px] font-black text-slate-600"></div>
  </div>
</section>
