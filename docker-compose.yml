services:
  civentral-web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      flood-risk-ai:
        condition: service_healthy
    expose:
      - 80
    environment:
      APP_ENV: ${APP_ENV:-staging}
      APP_DEBUG: ${APP_DEBUG:-false}
      CIVENTRAL_LEGACY_DB_ENABLED: ${CIVENTRAL_LEGACY_DB_ENABLED:-false}
      DB_HOST: ${DB_HOST:-}
      DB_PORT: ${DB_PORT:-}
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-https://civentral.tech/api/employee}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in Dokploy}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Set SUPABASE_SECRET_KEY in Dokploy}
      CITIZEN_AUTH_PROFILE_URL: ${CITIZEN_AUTH_PROFILE_URL:-https://civentral.tech/api/citizen/get-profile.php}
      CITIZEN_CORS_ALLOWED_ORIGINS: ${CITIZEN_CORS_ALLOWED_ORIGINS:-}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      PAGASA_TENDAY_BASE_URL: ${PAGASA_TENDAY_BASE_URL:-https://tenday.pagasa.dost.gov.ph}
      PAGASA_API_TOKEN: ${PAGASA_API_TOKEN:-}
      CIVENTRAL_AI_BASE_URL: http://flood-risk-ai:8098
      CIVENTRAL_AI_INTERNAL_KEY: ${CIVENTRAL_AI_INTERNAL_KEY:?Set CIVENTRAL_AI_INTERNAL_KEY in Dokploy}
      CIVENTRAL_AI_CONNECT_TIMEOUT_MS: ${CIVENTRAL_AI_CONNECT_TIMEOUT_MS:-1000}
      CIVENTRAL_AI_REQUEST_TIMEOUT_MS: ${CIVENTRAL_AI_REQUEST_TIMEOUT_MS:-5000}

  flood-risk-ai:
    build:
      context: .
      dockerfile: ml/flood-risk/service/Dockerfile
    restart: unless-stopped
    expose:
      - 8098
    environment:
      CIVENTRAL_AI_HOST: 0.0.0.0
      CIVENTRAL_AI_PORT: !!str 8098
      CIVENTRAL_AI_ALLOW_PUBLIC_BIND: !!str true
      CIVENTRAL_AI_REQUIRE_INTERNAL_AUTH: !!str true
      CIVENTRAL_AI_INTERNAL_KEY: ${CIVENTRAL_AI_INTERNAL_KEY:?Set CIVENTRAL_AI_INTERNAL_KEY in Dokploy}
      CIVENTRAL_AI_MODEL_PATH: ${CIVENTRAL_AI_MODEL_PATH:-}
      CIVENTRAL_AI_MODEL_MANIFEST_PATH: ${CIVENTRAL_AI_MODEL_MANIFEST_PATH:-}
      CIVENTRAL_AI_RISK_POLICY_PATH: ${CIVENTRAL_AI_RISK_POLICY_PATH:-}
      CIVENTRAL_AI_MAX_REQUEST_BYTES: ${CIVENTRAL_AI_MAX_REQUEST_BYTES:-16384}
      CIVENTRAL_AI_ENABLE_DOCS: !!str false
      CIVENTRAL_AI_LOG_LEVEL: ${CIVENTRAL_AI_LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8098/health
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
